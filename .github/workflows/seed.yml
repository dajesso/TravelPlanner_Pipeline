name: Seed Database

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run seed script
        run: npm run seed
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}

